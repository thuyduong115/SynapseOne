apiVersion: v1
kind: Secret
metadata:
  name: synapsedx-secrets
  namespace: synapsedx
type: Opaque
stringData:
  # DÙNG CHO VÍ DỤ — production dùng SealedSecrets / External Secrets, không commit secret thật.
  database-url: postgres://synapsedx:CHANGE_ME@postgres:5432/synapsedx
  iam-jwt-secret: CHANGE_ME_32chars_min
  oidc-client-secret: CHANGE_ME
  # OpenAI-compatible LLM provider key (ai-service — server-side only).
  ai-api-key: CHANGE_ME
  # Shared service-to-service credential (gateway + iam + workflow + ai PHẢI trùng nhau).
  internal-secret: CHANGE_ME_32chars_min
  # HMAC pepper cho hash API-key/refresh-token lúc nghỉ.
  api-key-pepper: CHANGE_ME_32chars_min
  # Synapse Storage: S3-compatible backend credentials + HMAC key for signed links.
  s3-access-key: CHANGE_ME
  s3-secret-key: CHANGE_ME
  storage-signing-secret: CHANGE_ME_32chars_min
