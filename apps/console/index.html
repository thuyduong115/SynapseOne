<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SynapseOne là nền tảng PaaS Tầng 1 mã nguồn mở (Apache-2.0): cổng API, IAM kiểu AWS, cụm dữ liệu lõi và quy trình, quản lý qua Console, SDK đa ngôn ngữ và CLI." />
    <meta name="theme-color" content="#f6f7fb" />
    <title>SynapseOne Console · Nền tảng PaaS mở</title>
    <script>
      // Apply the saved theme and language before first paint (mirrors src/lib/theme.jsx and src/lib/i18n.jsx).
      (function () {
        var root = document.documentElement;
        var choice = 'system';
        try { choice = localStorage.getItem('synapseone.theme') || 'system'; } catch (e) {}
        var dark = choice === 'dark' || (choice === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) root.classList.add('dark');
        root.style.colorScheme = dark ? 'dark' : 'light';
        try { var lang = localStorage.getItem('synapseone.lang'); if (lang === 'vi' || lang === 'en') root.lang = lang; } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="boot-splash" aria-label="Loading SynapseOne Console">
      <div class="boot-ring"></div>
      <p>Loading SynapseOne Console…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
