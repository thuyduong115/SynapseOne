# Prod overlay cho synapseone.space (dung kem compose chinh):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Edge cong khai duy nhat: nginx :80/:443 (synapseone.space, cloud.*, api.* + LE).
# Moi service khac bind 127.0.0.1 qua .env (debug local), khong public.
# Authentik/s3/postgres/redis: chi trong network noi bo.

services:
  gateway:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
      GATEWAY_VERIFY_APIKEY: "true"
    networks:
      synapseone-net:
        aliases: [synapseone-gateway]

  iam:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
      IAM_ALLOW_DEV_LOGIN: "false"
      IAM_ALLOW_OIDC_DEMO_CALLBACK: "false"
    # Unpublish internal API in prod (gateway-only access via docker network).
    # Requires Compose v2.24+ (!reset). Fallback is .env bind 127.0.0.1.
    ports: !reset []

  workflow:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
    ports: !reset []

  ai:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
    ports: !reset []

  lds:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
    ports: !reset []

  base:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
    ports: !reset []

  faststore:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
    ports: !reset []

  queue:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
    ports: !reset []

  prometheus:
    ports: !reset []

  console:
    environment:
      NODE_ENV: production
    networks:
      synapseone-net:
        aliases: [synapseone-console]

  # TLS terminator + Certbot webroot (renew khong downtime).
  nginx:
    build:
      context: ./infra/prod
    image: synapseone/edge:0.7.0
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-synapseone.space}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - gateway
      - console
    networks:
      synapseone-net:
      synapsedx-public-stack:
        aliases: [synapseone-edge]
      synapsecity-public-stack:
        aliases: [synapseone-edge]
      synapsecity-sos-public-stack:
        aliases: [synapseone-edge]

  certbot:
    image: certbot/certbot:latest
    restart: "no"
    # Entrypoint mac dinh cua image la `certbot`: `run --rm certbot certonly ...`
    # se thanh `certbot certonly ...`. Service thuong truc chi de giu volumes.
    entrypoint: ["certbot"]
    command: ["--version"]
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks: [synapseone-net]

volumes:
  certbot-www:
  letsencrypt:

networks:
  synapsedx-public-stack:
    external: true
  synapsecity-public-stack:
    external: true
  synapsecity-sos-public-stack:
    external: true
